name: Build NixOS ISO

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *" # Run monthly

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: git404x-dotfiles
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build ISO
        run: |
          nix build .#nixosConfigurations.iso.config.system.build.isoImage --print-build-logs

      - name: Extract ISO Path and Date
        id: iso
        run: |
          # Dynamically grab the exact generated filename
          ISO_PATH=$(ls result/iso/*.iso | head -n 1)
          ISO_NAME=$(basename "$ISO_PATH")
          echo "iso_path=$ISO_PATH" >> $GITHUB_ENV
          echo "iso_name=$ISO_NAME" >> $GITHUB_ENV
          echo "build_date=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.build_date }}.${{ github.run_number }}"
          name: "NixOS ISO (${{ env.build_date }})"
          generate_release_notes: true
          files: ${{ env.iso_path }}
          draft: false
          prerelease: false
